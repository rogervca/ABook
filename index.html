<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ABook Test</title>
  <style>
    body { background:#0f172a; color:white; font-family:sans-serif; text-align:center; padding:50px; }
    .btn { display:inline-block; padding:12px 24px; font-size:16px; background:#06b6d4; color:#020617; text-decoration:none; border-radius:8px; font-weight:bold; }
    .btn-gray { background:#475569; color:white; }
    #libraryScreen { display:none; }
    #libraryScreen:target { display:block; }
    body:has(#libraryScreen:target) #loginScreen { display:none; }
  </style>
</head>
<body>

  <div id="loginScreen">
    <h1>🚀 ABook Stage 1B Test</h1>
    <input type="text" placeholder="Type Alex..." style="padding:10px; font-size:16px;"><br><br>
    <a href="#libraryScreen" class="btn">Enter Library</a>
  </div>

  <div id="libraryScreen">
    <h1>Welcome to ABook, Student!</h1>
    <p style="color:#f59e0b; font-size:20px; font-weight:bold;">💵 Wallet: $20 Paper Money</p>
    <a href="#loginScreen" class="btn btn-gray">Logout</a>
  </div>

</body>
</html>
